<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>云之家 · 网页聊天</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="shell">
 <nav class="rail" aria-label="主导航"><a class="brand" href="/" title="云之家网页版">☁</a><button class="rail-active" aria-label="聊天">▤<small>消息</small></button><div class="rail-bottom"><span id="me-avatar" class="avatar mine-avatar">我</span><button id="logout" title="退出登录" aria-label="退出登录" hidden>↪</button></div></nav>
 <aside class="sidebar">
  <div class="sidebar-title"><h1>消息 <span id="total-unread" hidden></span></h1><button id="refresh-list" class="icon-button" title="刷新会话" aria-label="刷新会话" disabled>↻</button></div>
  <label class="search-box"><span>⌕</span><input id="search" placeholder="搜索联系人、群聊" aria-label="搜索联系人或群聊" disabled></label>
  <div class="list-tabs"><button id="all-tab" class="active">全部</button><button id="unread-tab">未读 <span id="unread-chats"></span></button></div>
  <div id="conversations" class="conversation-list" role="list" aria-label="聊天列表"><p class="empty">登录后显示聊天列表</p></div>
  <div class="connection"><span id="light"></span><span id="connection" role="status">尚未登录</span><span id="sync-time"></span></div>
 </aside>
 <main id="chat-main" class="chat-main">
  <header class="chat-header"><button id="back" class="icon-button" aria-label="返回聊天列表">‹</button><span id="chat-avatar" class="avatar header-avatar">☁</span><div class="chat-heading"><h2 id="chat-name">云之家网页版</h2><p id="chat-meta">个人账号 · 联系人和群聊</p></div><button id="history-search-toggle" class="icon-button" title="搜索已加载的消息" aria-label="搜索对话内容" disabled>⌕</button><button id="members-toggle" class="icon-button" title="会话资料" aria-label="会话资料" disabled>⋯</button></header>
  <div id="history-search-bar" class="history-search" hidden><input id="history-search" placeholder="搜索已加载的消息内容" aria-label="搜索已加载的消息内容"><span id="history-match"></span><button id="search-prev" class="icon-button" aria-label="上一个结果">↑</button><button id="search-next" class="icon-button" aria-label="下一个结果">↓</button><button id="search-close" class="icon-button" aria-label="关闭消息搜索">×</button></div>
  <section id="login" class="login-card"><div class="login-copy"><span class="login-logo">☁</span><h2>在网页上，继续你的对话</h2><p>用云之家 App 扫码并确认登录<br>无需桌面客户端，账号会话保留在本机</p><button id="refresh" class="primary">获取登录二维码</button><p id="login-status" role="status"></p></div><div class="qr-box"><img id="qr" alt="云之家登录二维码" hidden><span id="qr-placeholder">☁<small>等待获取二维码</small></span></div></section>
  <section id="conversation-view" class="conversation-view" hidden>
   <div id="messages" class="messages" tabindex="0" role="log" aria-label="消息记录" aria-live="off"><div class="welcome"><span>☁</span><h2>选择一个对话</h2><p>聊天消息会在这里实时更新</p></div></div>
   <button id="new-messages" class="new-messages" hidden>有新消息 ↓</button><div id="history-error" class="history-error" role="status" hidden></div>
   <div id="composer" class="composer"><div class="composer-toolbar"><button id="choose-images" class="toolbar-button" aria-label="选择图片" title="发送图片">▧</button><span>支持拖拽图片、粘贴截图</span><span id="sending-target"></span><input type="file" id="files" accept="image/png,image/jpeg,image/gif,image/bmp" multiple hidden></div><div id="previews" class="previews"></div><textarea id="text" placeholder="输入消息…" aria-label="文字消息" disabled></textarea><div class="send-footer"><span id="send-status" role="status"></span><span class="keyboard-tip">Enter 发送 · Shift+Enter 换行</span><button id="send" class="primary" disabled>发送 ↗</button></div></div>
  </section>
  <section id="details" class="details-panel" hidden><div><h3>会话资料</h3><button id="details-close" class="icon-button" aria-label="关闭会话资料">×</button></div><p id="details-content"></p></section>
 </main>
</div>
<dialog id="image-viewer"><button id="image-close" class="image-close" aria-label="关闭图片预览">×</button><img id="full-image" alt="图片原图"><footer><span id="image-name"></span><a id="image-download" download>下载原图</a></footer></dialog>
<script type="module" src="/app.js"></script>
</body></html>
